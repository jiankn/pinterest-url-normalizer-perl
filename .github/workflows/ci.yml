name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl: ['5.14', '5.26', '5.40']
    steps:
      - uses: actions/checkout@v4
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
      - name: Configure
        run: perl Makefile.PL
      - name: Test
        run: make test

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.40'
      - name: Build and test source tree
        run: |
          perl Makefile.PL
          make test
          make dist
      - name: Install built distribution
        run: |
          cpanm --notest --local-lib-contained "$PWD/local" ./Pinterest-URL-Normalizer-0.1.0.tar.gz
      - name: Invoke installed CLI
        run: |
          output=$("$PWD/local/bin/pinterest-url-normalizer" 'https://pinterest.co.uk/pin/123456789/?utm_source=share')
          test "$output" = 'https://www.pinterest.com/pin/123456789/'
      - name: Validate release metadata and tag consistency
        run: |
          PERL5LIB="$PWD/local/lib/perl5" perl -MCPAN::Meta -e '
            my $meta = CPAN::Meta->load_file("MYMETA.json");
            die "wrong name\n" unless $meta->name eq "Pinterest-URL-Normalizer";
            die "wrong version\n" unless $meta->version eq "0.1.0";
            die "wrong homepage\n" unless $meta->resources->{homepage} eq "https://savepinner.com/pinterest-downloader/";
            if (defined $ENV{GITHUB_REF_NAME} && $ENV{GITHUB_REF_TYPE} eq "tag") {
              die "tag/version mismatch\n" unless $ENV{GITHUB_REF_NAME} eq "v" . $meta->version;
            }
          '
      - uses: actions/upload-artifact@v4
        with:
          name: cpan-distribution
          path: Pinterest-URL-Normalizer-0.1.0.tar.gz
          if-no-files-found: error
